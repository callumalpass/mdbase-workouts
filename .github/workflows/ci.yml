name: Test and deploy Pages

on:
  push:
    branches: [main, dogfood/mdbase-connect]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Build Pages application
        run: npm run build

      - name: Record deployed manifest digest
        id: manifest
        run: node -e 'const { createHash } = require("node:crypto"); const { appendFileSync, readFileSync } = require("node:fs"); const digest = createHash("sha256").update(readFileSync("dist/.well-known/mdbase-app.json")).digest("hex"); appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${digest}\n`);'

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify application manifest
        env:
          MANIFEST_URL: https://callumalpass.github.io/mdbase-workouts/.well-known/mdbase-app.json?commit=${{ github.sha }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.test.outputs.manifest-sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          let source;
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            try {
              const response = await fetch(`${process.env.MANIFEST_URL}&attempt=${attempt}`, { cache: "no-store" });
              if (response.ok) {
                const candidate = Buffer.from(await response.arrayBuffer());
                const digest = createHash("sha256").update(candidate).digest("hex");
                if (digest === process.env.EXPECTED_MANIFEST_SHA256) {
                  source = candidate;
                  break;
                }
              }
            } catch {}
            if (attempt < 10) await new Promise((resolve) => setTimeout(resolve, 2_000));
          }
          if (!source) {
            throw new Error("The deployed manifest does not match the uploaded Pages artifact.");
          }
          const manifest = JSON.parse(source);
          const appUrl = "https://callumalpass.github.io/mdbase-workouts/";
          const contracts = ["exercise", "plan", "plan-template", "quick-log", "session"]
            .map((name) => `mdbase.workouts.${name}`);
          const actualContracts = manifest.requirements?.contracts
            ?.map(({ id, version }) => `${id}@${version}`)
            .sort();
          const expectedContracts = contracts.map((id) => `${id}@1.0.0`).sort();
          if (
            manifest.id !== "dev.mdbase.workouts" ||
            manifest.name !== "MDBase Workouts" ||
            manifest.homepage !== appUrl ||
            JSON.stringify(manifest.redirect_uris) !== JSON.stringify([appUrl]) ||
            manifest.requirements?.access !== "full_collection" ||
            JSON.stringify(actualContracts) !== JSON.stringify(expectedContracts) ||
            manifest.provisions?.type_packs?.length !== 1
          ) throw new Error("The deployed Workouts manifest does not match the production declaration.");
          NODE
